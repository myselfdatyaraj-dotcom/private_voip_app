name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Custom Android Setup
      run: |
        rm -rf android
        flutter create --platforms=android --org com.control.private_voip_app .
        
        # Patch build.gradle for WebRTC compatibility
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
        sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
