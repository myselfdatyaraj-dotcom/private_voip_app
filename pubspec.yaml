name: private_voip_app
description: Private Encrypted VoIP Communication App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebRTC (Audio & Video Calling)
  flutter_webrtc: ^0.12.0

  # WebSocket Signaling
  web_socket_channel: ^3.0.3

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.5.3

  # UUID Generator
  uuid: ^4.5.1

  # Encryption
  encrypt: ^5.0.3
  cryptography: ^2.7.0

  # Permissions
  permission_handler: ^12.0.1

  # Network
  connectivity_plus: ^6.1.4

  # Notifications
  flutter_local_notifications: ^19.4.0

  # Firebase (Optional for Notifications/Auth)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0

  # Image Picker
  image_picker: ^1.1.2

  # File Picker
  file_picker: ^10.3.2

  # Contacts
  flutter_contacts: ^1.1.9+2

  # Date & Time
  intl: ^0.20.2

  # HTTP API
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
